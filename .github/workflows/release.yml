# Builds the HOC Terminal desktop app and publishes the installers as a public release in this repository.
# Run it from Actions → "Release" → Run workflow and enter the version (e.g. 1.0.0).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set the version
        shell: bash
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm install --no-audit --no-fund
      # Code signing switches on by itself when the certificates are saved as repository secrets
      # (Settings → Secrets and variables → Actions). Without them the builds are unsigned, as before.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CERT: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
        run: |
          if [ -n "$WIN_CERT" ]; then
            export CSC_LINK="$WIN_CERT" CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
            node scripts/signing.js win
          else
            echo "No Windows certificate in the secrets – building unsigned."
          fi
          npm run dist:win
      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT" ]; then
            export CSC_LINK="$MAC_CERT" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            node scripts/signing.js mac
          else
            echo "No Apple certificate in the secrets – building unsigned."
          fi
          npm run dist:mac
      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: HOC Terminal ${{ inputs.version }}
          body: "HOC Terminal for Windows and Mac. Download it from the Downloads page in the HOC Terminal."
          files: |
            dist/*.exe
            dist/*.dmg
